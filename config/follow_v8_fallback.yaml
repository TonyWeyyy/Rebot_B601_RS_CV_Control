# v8.0 实机认可稳定基线回退：仅关闭 v9 三项新增策略，其余参数与 v8.0 一致。
# 用法：python palm_follow_grasp.py --follow-cfg config/follow_v8_fallback.yaml
# ============================================================
# 手掌跟随 伺服参数配置（含每个参数的调节范围标注）
# ------------------------------------------------------------
# palm_follow_grasp.py / palm_follow_fixed_orientation.py 启动时读取。
# 优先级：命令行参数 > 本文件 > 代码内置默认值。
#   例：python palm_follow_grasp.py            → 全部用本文件
#       python palm_follow_grasp.py --distance 0.35
#                                              → 仅距离被命令行覆盖
# 只改数字即可，改完直接重启脚本生效，不用动代码。
#
# 【提速版 vs 稳定版对照】（当前 = 提速版，晃了就逐项回退）
#   vel_feedforward:      提速 1.0  / 稳定 0.9
#   smooth_alpha:         提速 0.52 / 稳定 0.45
#   max_accel:            提速 2.8  / 稳定 2.0
#   reversal_accel_boost: 提速 2.0  / 稳定 1.8
#   depth_oe_min_cutoff:  提速 0.75 / 稳定 0.52
#   ff_smooth:            提速 0.55 / 稳定 0.48
#
# 范围标注说明：
#   【范围】= 物理/稳定性允许的硬边界，超出去大概率出问题
#   【推荐】= 实测好用的区间，日常在这个范围内调
# ============================================================

follow:
  # ---- 跟随目标 ----
  distance: 0.35          # 期望相机到掌心距离 (m)
                          # 【范围】0.20 ~ 0.60（代码硬性拒绝 <0.18 或 >0.60）
                          # 【推荐】0.25 ~ 0.45
                          # 太小：撞 Gemini 2 近距盲区（~0.15m），深度丢失
                          # 太大：检测不稳、工作空间容易触虚拟墙

  # ---- 增益（分方向）----
  gain: 2.35              # 竖直/深度方向位置增益（Y/Z）（2.35 最终版：响应/止振平衡）
                          # 【范围】1.0 ~ 3.5
                          # 【推荐】2.0 ~ 3.0
                          # 太小：跟随拖沓；太大：上下/前后方向出现振荡
  gain_x: 2.4             # 水平方向增益（X，左右跟随，靠底座 J1 偏航）
                          # 【范围】0.8 ~ 2.5
                          # 【推荐】1.4 ~ 2.2
                          # J1 惯量大限速低，偏高会饱和振荡（左右晃就先降它）

  # ---- 速度上限 ----
  max_vel: 0.50           # 最大末端线速度 (m/s)
                          # 【范围】0.10 ~ 0.70（关节上限提到 2.0 rad/s 后提速空间打开）
                          # 【推荐】0.30 ~ 0.50
                          # 注意与适配层 MAX_JOINT_SPEED 串联：
                          # 关节限速不提，光提这个没效果
  max_vel_joint: 1.50     # 最大关节速度 (rad/s)
                          # 【范围】0.6 ~ 2.0
                          # 【推荐】1.2 ~ 1.8
                          # 电机额定 ≈10.5 rad/s，硬件余量大；
                          # >1.5 后振荡倾向明显增大（瓶颈转到视觉延迟）；
                          # 出现抖动就退回 1.5
  max_vel_angular: 1.50   # 最大角速度 (rad/s)
                          # 【范围】0.5 ~ 2.0
                          # 【推荐】1.2 ~ 1.6（姿态保持任务，一般不用动）

  # ---- 死区（静止稳定性）----
  position_deadband: 0.022    # 3D 误差死区 (m)（须 > BS 模式 z 噪声 ±20mm，0.017 仍被噪声推出）
                              # 【范围】0.008 ~ 0.030
                              # 【推荐】0.012 ~ 0.020
                              # 静止仍微抖 → 调大；想贴更近 → 调小
                              # <0.010 会围绕目标持续微抖
  deadband_hysteresis: 1.6    # 死区迟滞倍数（退出阈值 = 死区 × 此值）
                              # 【范围】1.2 ~ 2.5
                              # 【推荐】1.5 ~ 2.0
                              # 太大：手小幅移动机械臂不理（>死区×此值才动）
  orientation_deadband_deg: 2.0   # 姿态误差死区（度）
                                  # 【范围】1.0 ~ 5.0
                                  # 【推荐】2.0 ~ 3.0，一般不用动

  # ---- 目标速度前馈（高速跟随不拖后的关键）----
  vel_feedforward: 1.0    # 前馈系数（仿真寻优 0.88，取整 0.9）
                          # 【范围】0.0 ~ 1.0（0 = 完全关闭前馈）
                          # 【推荐】0.7 ~ 1.0
                          # 太大：机械臂超前于手、冲过头摆动
  ff_smooth: 0.55         # 目标速度估计平滑系数（新值权重）
                          # 【范围】0.1 ~ 0.6
                          # 【推荐】0.2 ~ 0.4，一般不用动
  ff_max_vel: 0.7         # 前馈速度限幅 (m/s)，防检测丢帧跳变
                          # 【范围】0.3 ~ 1.0
                          # 【推荐】0.5 ~ 0.8，应 ≥ 手正常挥动速度
  ff_min_speed: 0.030     # 目标速度低于此值视为静止，前馈置零
                          # 【范围】0.03 ~ 0.10
                          # 【推荐】0.04 ~ 0.08
                          # 太小：静止时噪声被注入；太大：慢速引导时前馈不生效
  ff_taper_dist: 0.07    # 前馈近端渐弱距离 (m)（仿真寻优结果）
                          # 【范围】0.04 ~ 0.12
                          # 【推荐】0.05 ~ 0.10
                          # 到位后回环振荡 → 调大；巡航跟不上 → 调小

  # ---- 速度感知停靠（只减前馈，不增加 lead/增益/速度）----
  ff_adaptive_taper_enable: false # v8.0 回退：固定 ff_taper_dist 行为
  ff_taper_speed_ref: 0.35        # 接近速度达到此值时使用最大停靠距离 (m/s)
                                  # ≤0.10m/s 慢速接近保持 v8.0；远离目标不额外制动
  ff_taper_max_dist: 0.12         # 快速接近的停靠距离上限 (m)，不得小于 ff_taper_dist

  # ---- 卡尔曼目标滤波（恒速模型，第一版 lead=0 只取速度喂前馈）----
  # 替代旧的「帧间差分+EMA」速度估计。仿真（观测噪声 σ=2cm）：
  # 速度 RMSE 0.54→0.20 m/s（-63%），静止假速度 0.58→0.15 m/s（-74%）。
  kf_enable: true         # false = 退回旧差分路径（出问题先关它，独立回退）
  kf_q: 1.5               # 过程噪声：手的加速度能力 (m/s^2)^2（1.5=更稳，log42 调优）
                          # 【范围】0.5 ~ 10
                          # 【推荐】1 ~ 5
                          # 大=跟踪快但噪声多（≈EMA 调大）；小=平滑好但滞后大
  kf_r: 0.004             # 标量观测噪声方差（旧配置回退基准）
                          # 【范围】0.001 ~ 0.01
  kf_r_xy: 0.0025         # X/Y 分轴观测噪声：适度提高横向响应，不一步降到激进值
  kf_r_z: 0.004           # Z 保持 v7.1 强度；静止变晃先把 XY 也恢复为 0.004
  kf_lead_ms: 8.0         # 基础 lead (ms)。KF 先按观测年龄外推到现在，再叠加 lead；
                          # 0 = 完全关闭额外 lead（动态模式也不会自行开启）
  kf_dynamic_lead: true   # true = 基础 lead + 本帧视觉处理耗时；重复帧不累计
  kf_lead_max_ms: 20.0    # 动态 lead 硬上限；跳变剔除/重同步/深度冻结另有门控
                          # 换向或停手过冲：先调低 kf_lead_ms 或 max，不要关深度保护
  kf_lead_adaptive: true  # 最终版：速度×距离×方向门控；静止残速不再持续外推
  kf_lead_near_dist: 0.022 # 剩余误差小于此值，额外 lead 目标权重为 0
  kf_lead_full_dist: 0.045 # 实机稳定后提前进入全量 lead，改善中速跟手性
  kf_lead_dir_full_cos: 0.50 # 速度/误差方向余弦达到 0.5 时方向权重为 1；反向必为 0
  kf_lead_attack_tau: 0.025 # 运动确认后更快恢复；静止/反向撤权规则不变
  kf_lead_release_tau: 0.015 # lead 撤回时间常数(s)：更快，停手优先稳定
  kf_ff_deadband_off: 0.06  # KF 速度死区下沿 (m/s)：速度估计低于此值判定手已停，
                          # 前馈与 lead 外推整体归零（修「伸展停手抖动」log33）
                          # 【范围】0.03 ~ 0.10；停了还抖 → 调大；起步迟钝 → 调小
  kf_ff_deadband_on: 0.13   # 死区回差上沿：速度超过才恢复运动状态（防边界抖动）
                          # 建议保持 ≈1.8× off；停手仍振荡可升到 0.13~0.15
  kf_ff_exit_frames: 7      # 跳出静止确认帧数：速度须连续 N 周期越过上沿才
                          # 恢复运动（修死区状态边界闪烁导致的停手振荡 log38）
                          # 【范围】1 ~ 10；100Hz 下 7≈70ms 确认窗（原140ms注释为50Hz旧值）
  kf_fast_start_enable: false # 实机A/B稳定基线：关闭额外解锁；速度确认通道仍保留
  kf_fast_start_frames: 2     # 连续新三维观测数，60fps 下 2 帧≈33ms，不按控制周期计数
  kf_fast_start_dist: 0.030   # 相对锁存起点的累计位移 (m)；静止抖动误触发则升到0.035~0.040
  kf_fast_start_dir_cos: 0.80 # 方向一致性（1=完全同向）；换向会清零确认并重新起算
  kf_hold_tol: 0.04         # 静止目标锁存容差 (m)：手停时目标钉死在锁存点，
                          # 观测噪声完全隔离（修伸展位停手抖动 log35）
                          # 【范围】0.02 ~ 0.05
  kf_slow_follow_enable: true  # 慢拖只迁移锁存目标，不解锁前馈/lead；false 完全回退
  kf_slow_follow_dist: 0.014   # 连续位移确认门槛 (m)，低于 hold_tol，减少慢拖迟钝
  kf_slow_follow_release: 0.008 # 回到此范围内停止慢速迁移，形成回差
  kf_slow_follow_frames: 3      # 只统计新三维观测，同向连续确认；静止噪声不能直接解锁
  kf_slow_follow_dir_cos: 0.80  # 换向立即清零，重新确认
  kf_slow_follow_speed: 0.045   # 锁存迁移限速 (m/s)，不得超过原通道 0.06

  # ---- 自适应过程噪声 Q（跟手性增强，静止段无感）----
  kf_adapt_enable: false    # 自适应 Q 总开关：创新（观测-预测偏差）大说明手在
                          # 加速 → 临时放大 Q 让滤波器更信观测、跟上更快；
                          # 平稳段自动回到基准 Q，静止/匀速平滑度不受影响
  kf_adapt_ref: 0.10        # 创新参考值 (m)：倍率 = clip(创新/ref, 1, max)
                          # 【范围】0.05 ~ 0.15；调小 = 更灵敏（log41 噪声大会误触发）
  kf_adapt_max: 2.5         # Q 最大放大倍率：温和提速（噪声环境别超 3）
                          # 【范围】1.5 ~ 6；低噪声环境可到 4，本机建议 ≤3
  kf_adapt_decay: 0.85      # 无新观测周期的倍率衰减：毛刺过后 ~0.08s 回到 1×
                          # 【范围】0.80 ~ 0.98；调小 = 更快回落到平滑模式

  # ---- 分轴自适应 Q（v9；连续同向创新确认后才增强 XY）----
  kf_axis_adapt_enable: false  # v8.0 回退：固定 Q；旧标量自适应也保持关闭
  kf_axis_adapt_ref_xy: 0.060  # X/Y 单轴创新参考值 (m)，低于此值不确认加速
  kf_axis_adapt_ref_z: 0.080   # Z 创新参考值；默认 max_z=1，深度噪声不会被放大
  kf_axis_adapt_max_xy: 1.60   # X/Y 最大过程噪声倍率，硬限制 1.0~2.0
  kf_axis_adapt_max_z: 1.00    # Z 默认不放大；实机 A/B 前不要提高
  kf_axis_adapt_confirm: 2     # 连续同向新观测确认数，换向/静止/丢手立即重算
  kf_axis_adapt_attack_tau: 0.040  # 加速倍率上升时间常数 (s)
  kf_axis_adapt_release_tau: 0.120 # 平稳后回基准倍率时间常数 (s)
  kf_axis_adapt_static_guard: false # v8 回退不使用 v9.1 静止 Q 保护
  static_velocity_hold_enable: false # v8 回退不清理残余速度状态
  static_velocity_hold_speed: 0.025
  static_velocity_hold_delay_s: 0.03

  # ---- 滤波与平滑 ----
  smooth_alpha: 0.48      # 速度指令 EMA 平滑系数（新指令权重）（0.48 最终版）
                          # 【范围】0.2 ~ 0.6
                          # 【推荐】0.3 ~ 0.55
                          # 小=平滑但滞后大；大=响应脆、过冲小但噪声多
  reversal_fast_response: true    # 方向反转时清除平滑惯性

  # ---- 加速度限制（启停平顺性）----
  max_accel: 2.8          # 末端线速度指令的最大加速度 (m/s^2)
                          # 【范围】0.5 ~ 5.0
                          # 【推荐】1.5 ~ 3.0
                          # 启停/刹不住地抖 → 调小（更柔和）；
                          # 觉得起步肉、跟不上 → 调大（2.5~3.0 仍有明显效果）
  reversal_accel_boost: 2.0   # 方向反转时的加速度额度倍数
                              # 【范围】1.0 ~ 3.0
                              # 反向纠错偏慢 → 调大；反向那一下有顿挫 → 调小
                                  # 【取值】true / false
                                  # 除非做对照实验，否则保持 true
  depth_oe_min_cutoff: 0.75   # 深度通道 One Euro 静止截止频率 (Hz)（压静止 z 噪声）
                              # 【范围】0.5 ~ 2.0
                              # 【推荐】0.7 ~ 1.2
                              # 静止微抖 → 调小；前后跟随肉 → 调大
  depth_oe_beta: 0.03         # 深度 One Euro 运动放开系数
                              # （手快速靠近/远离时自动放开滤波）
  z3d_max_jump: 0.08      # 深度跳变剔除阈值 (m)
                          # 【范围】0.04 ~ 0.15
                          # 【推荐】0.06 ~ 0.10
                          # 单帧 |Δz| 超阈值视为误检帧丢弃（等效本帧手掌丢失）
                          # 太小：快速贴近/远离相机时误杀正常帧
                          # 太大：误检尖峰漏网，手臂猛冲
                              # 【范围】0.005 ~ 0.05
                              # 【推荐】0.01 ~ 0.03，一般不用动

  # ---- 伸展度增益调度（前伸停靠振荡的解药）----
  # 手臂前伸越多，J1 杠杆臂越长、整臂刚度越低，同一组增益在
  # 伸展位姿会超出稳定裕度。TCP 水平半径 ≤ reach_soft_start 时
  # 参数原样；到 reach_soft_end 线性衰减到 reach_min_scale。
  reach_soft_start: 0.27  # 开始衰减的水平伸展半径 (m)（仿真寻优：晚介入+低增益优于早介入）
                          # 【范围】0.15 ~ 0.35
                          # 【推荐】0.20 ~ 0.28；太小：正常工作区也变肉
  reach_soft_end: 0.40    # 衰减到底的半径 (m)
                          # 【范围】0.30 ~ 0.50，应 ≈ workspace 的 X 上限
  reach_min_scale: 0.58   # 最深伸展时停靠段线速度指令的保留比例
                          # 【范围】0.40 ~ 1.00
                          # 【推荐】0.50 ~ 0.70
                          # 前伸停靠还抖 → 调小；前伸停靠太肉 → 调大；1.0 = 关闭本机制
  reach_dock_dist: 0.21   # 停靠段半径 (m)：误差小于此值才开始按伸展度衰减
                          # 【范围】0.10 ~ 0.30
                          # 【推荐】0.15 ~ 0.25
                          # 巡航段（误差大）永远全速，伸展区追手不受影响；
                          # 调太小：衰减介入太晚，停靠振荡压不住

  # ---- 姿态保持 ----
  k_orientation: 1.6      # 姿态修正增益（跟随中保持初始姿态）
                          # 【范围】0.8 ~ 2.5
                          # 【推荐】1.2 ~ 2.0
                          # 太大：末端出现扭振；太小：姿态漂移纠正慢

  # ---- 相机 ----
  fps: 60                 # 相机帧率
                          # 【取值】30 / 60（Gemini 2 在 640x480 下只有这两档实用）
                          # 60 = 感知延迟砍半，高速跟随首选；
                          # 若 DBG 行 fps 实测只有 40 左右，说明 CPU 跑不动，退回 30
  camera_hw_timestamp_enable: false # 默认主机时刻=v7.1；确认实机日志 hw=1 且稳定后再启用
  camera_hw_max_transport_s: 0.20   # 倒退/跳变/负延迟/超龄自动回退主机单调时刻
  diag_enable: true         # 100Hz CSV 环形队列+后台批量写盘；不在控制线程写磁盘
  diag_queue_size: 8192     # 队列满只丢诊断样本，绝不阻塞伺服；日志在 logs/
  diag_actual_feedback_hz: 0.0 # v8.0 回退：不做同步 CAN 实际关节读取
                               # 独立低频线程，只记实际/采样点指令及跟踪误差，不参与控制
  color_exposure_ms: 6.0  # 彩色手动曝光（毫秒），0 = 自动曝光
                          # 命令行 --color-exposure 可临时覆盖本值
                          # 【范围】0 ~ 12
                          # 暗室自动曝光约 12ms → 运动模糊大、易丢手；
                          # 设 6~8 模糊减半，代价是画面变暗（需环境光配合）；
                          # 有补光时可压到 4~5，识别最稳
                          # 启动时自动做亮度标定（本机曝光单位=1μs，非UVC标准）

  # ---- 架构切换（新/老版本无缝切换的唯一开关）----
  # kf_enable: true  = 新架构（卡尔曼滤波：速度估计更干净，可叠加 lead 外推
  #                    与静止锁存；跟随更跟手，延迟补偿更强）
  # kf_enable: false = 老架构（帧间差分+EMA：无 lead、无锁存，运动更温润；
  #                    ff_smooth / ff_min_speed / ff_taper_dist 生效）
  # 两套架构共用同一套安全机制（软墙/伸展衰减/加速度限制/丢失外推），
  # 切换只需改这一个键并重启脚本。
  #
  # 【老架构配套参数组】切到 kf_enable: false 时，建议同时改成下面这套
  # （旧版实测平顺的参数，即"稳定版"列；改法=把对应键的值换掉）：
  #   vel_feedforward: 0.9        （当前新架构值 1.0）
  #   ff_smooth: 0.48             （当前 0.55）
  #   smooth_alpha: 0.45          （当前 0.52）
  #   max_accel: 2.0              （当前 2.8）
  #   reversal_accel_boost: 1.8   （当前 2.0）
  #   depth_oe_min_cutoff: 0.52   （当前 0.75）
  #   z_freeze_max: 0             （当前 0.20；设 0 = 完全复刻旧版丢失流程）
  #   老架构下 kf_q / kf_r / kf_lead_ms / kf_ff_deadband_* / kf_hold_tol
  #   自动失效，不用删。

  # ---- 检测+跟踪混合（光流桥接，掉检帧顶帧）----
  hybrid_track_enable: true   # MediaPipe 掉检帧用 LK 光流点阵桥接，短暂
                          # 模糊掉检不再触发丢失保持；false = 回旧行为
  hybrid_max_frames: 15       # 连续桥接上限（帧）：超出自动放弃回丢失流程
                          # 【范围】5 ~ 30（15 ≈ 0.25s）
  hybrid_box_half: 45         # 桥接点阵半边长 (px)：掌心周围 3×3 采样区
                          # 【范围】30 ~ 70
  hybrid_max_step_px: 90      # 单帧允许的最大位移 (px)：超出判定跟踪飞点
                          # 【范围】50 ~ 150

  # ---- 进阶参数（一般不用动；原硬编码，现开放可调）----
  servo_direction: 1.0      # 运动方向完全相反时改 -1.0（标定反了的症状）
  kf_resync_frames: 3       # KF 连续跳变剔除帧数上限：达到后认定手真的移了位，
                          # 重同步（位置采纳、速度清零），滤波器永不锁死
                          # 【范围】2 ~ 5
  z3d_max_rate: 0.05        # 深度限速 (m/帧)：单帧深度变化上限，参照失效时的最后防线
                          # 【范围】0.02 ~ 0.10
  z_freeze_max: 0.20        # 深度冻结最长时长 (s)：2D 新鲜但深度无效时冻结 z
                          # 【范围】0.10 ~ 0.40；0 = 关闭冻结（回老版丢失流程）
  lost_hold_s: 0.30         # 连续丢手超过此秒数 → 机械臂保持不动
                          # 【范围】0.15 ~ 0.60
  coast_window_s: 0.12      # 丢失外推（滑行）窗口时长 (s)：掉帧按丢失瞬间速度续推
                          # 【范围】0.05 ~ 0.20
  coast_decay_per20ms: 0.90 # 外推速度每 20ms 衰减系数（防爆冲）
                          # 【范围】0.80 ~ 0.98；小=外推迅速衰减，大=顶得久
  coast_max_vel: 0.35       # 外推速度限幅 (m/s)
                          # 【范围】0.20 ~ 0.50
  target_stale_s: 0.12      # 控制侧观测看门狗：视觉卡住超过此时间即按丢手处理
                          # 保留最后目标走有界 coast；不建议大于 lost_hold_s
  reach_att_tau: 0.15       # 伸展衰减乘子平滑时间常数 (s)（修伸展区增益跳变抖动）
                          # 【范围】0.05 ~ 0.40；大=更平顺但介入慢
  damping_base: 0.010       # 雅可比阻尼伪逆基础阻尼（奇异保护）
                          # 【范围】0.005 ~ 0.030
  damping_adaptive: true    # 可操作度低时自动加大阻尼+限速
  manipulability_threshold: 0.004   # 可操作度阈值：低于此值触发自适应阻尼
  min_manip_speed_scale: 0.35       # 奇异区速度保留比例下限

# ---- 工作空间虚拟墙（基座系，米）----
# ⚠️ 安全相关：按你的实际桌面环境测量后修改！
# 【范围】X: 0.05~0.45（前后），Y: -0.40~0.40（左右），Z: 0.03~0.60（高度）
# 软墙只削"继续往外走"的速度分量，允许贴墙滑动和向内返回；
# 收缩边界 = 更保守，放宽边界 = 更大工作范围但需确认无碰撞物
workspace:
  min: [-0.40, -0.10, 0.03]     # X 前后 / Y 左右 / Z 高度 下限
  max: [ 0.40,  0.40, 0.60]     # X 前后 / Y 左右 / Z 高度 上限
  max_radius: 0.42              # 水平径向 hypot(X,Y) 上限：70%臂展；不占用Z空间
                                # 只削水平向外速度，保留向内/切向/竖直运动；+5cm回HOME
