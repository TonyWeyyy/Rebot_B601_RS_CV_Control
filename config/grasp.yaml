# ============================================================
# 捏合 → 夹爪（J7）映射配置
# ------------------------------------------------------------
# 主程序 palm_follow_grasp.py 读取本文件。
# 夹爪角度单位为【度】（rebot_control 第 7 通道），
# 像素距离为拇指尖(4)—食指尖(8) 在画面中的距离。
# 夹爪开合角度请用 gripper_j7_calibrate.py 实测后回写。
# ============================================================

pinch:
  closed_px: 20.0        # 捏合（拇指食指碰拢）时的像素距离
  open_px: 200.0         # 五指张开时的像素距离

  # ---- 目标滤波 ----
  # one_euro = 静止时强滤波、快速运动时自动降低滤波强度（默认，推荐）；
  # ema      = 旧版固定系数低通，兼容 config 中的 smoothing 参数。
  filter_type: one_euro
  smoothing: 0.35        # 仅 filter_type=ema 时使用（0~1，越大跟随越快）

  # ---- One Euro 参数（仅 filter_type=one_euro 时使用）----
  # 跟随慢/肉：先把 beta 从 0.010 逐步加到 0.015~0.020；
  # 静止仍抖：把 min_cutoff 从 2.0 降到 1.5。
  min_cutoff_hz: 2.0
  beta: 0.010
  dcutoff_hz: 1.0

  deadband_deg: 2.0      # 目标角变化小于该值不更新（防抖：指尖是关键点中
                         #   噪声最大的，死区太小会让夹爪持续小动作）

gripper:
  enabled: true          # false = 只跟随手掌，夹爪保持不动
  # ---- 稳定性选项 ----
  # 手臂运动时冻结夹爪：相机装在手腕上（eye-in-hand），跟随过程中
  # 夹爪动作引起的振动会直接抖动画面的掌心 3D 估计，让跟随显得不稳。
  # true = 手臂基本静止（关节速度 < 阈值）时才更新夹爪——
  #   即「手停下 → 捏合抓取；手在引导 → 夹爪不动」，跟随手感最稳。
  # false = 跟随与夹爪随时同时生效（旧行为）。
  hold_while_moving: true
  move_speed_threshold: 0.05   # 「手臂在运动」的关节速度判定阈值 (rad/s)
  # ---- 夹爪开合标定（度，J7 电机角度）----
  # 当前值为实测标定结果（由 gripper 项目 cv_control.yaml 弧度值换算：
  #   闭合 -0.3436 rad = -19.69° / 张开 +5.1237 rad = +293.57°）
  # 若拆装过夹爪或重设过零点，请运行 gripper_j7_calibrate.py 重新实测！
  closed_deg: -19.7      # 夹爪闭合
  open_deg: 293.6        # 夹爪张开
