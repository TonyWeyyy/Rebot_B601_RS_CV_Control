# ============================================================
# 手掌跟随 伺服参数配置
# ------------------------------------------------------------
# palm_follow_grasp.py / palm_follow_fixed_orientation.py 启动时读取。
# 优先级：命令行参数 > 本文件 > 代码内置默认值。
#   例：python palm_follow_grasp.py            → 全部用本文件
#       python palm_follow_grasp.py --distance 0.35
#                                              → 仅距离被命令行覆盖
# 只改数字即可，改完直接重启脚本生效，不用动代码。
# ============================================================

follow:
  # ---- 跟随目标 ----
  distance: 0.35          # 期望相机到掌心距离 (m)，建议 0.20~0.50，勿 < 0.20
                          # （Gemini 2 近距极限 ~0.15m）

  # ---- 增益（分方向）----
  gain: 2.5               # 竖直/深度方向位置增益（Y/Z）
  gain_x: 1.8             # 水平方向增益（X，左右跟随，靠底座 J1 偏航，
                          #   惯量大限速低，高了会饱和振荡，左右晃就调低它）

  # ---- 速度上限 ----
  max_vel: 0.30           # 最大末端线速度 (m/s)，首次调试建议 0.10
  max_vel_joint: 1.20     # 最大关节速度 (rad/s)，适配层还有第二道限幅
  max_vel_angular: 1.20   # 最大角速度 (rad/s)

  # ---- 死区（静止稳定性）----
  position_deadband: 0.015    # 3D 误差死区 (m)：静止仍微抖 → 0.020；
                              #   想贴更近 → 0.010（太小会围目标微抖）
  deadband_hysteresis: 1.5    # 死区迟滞：进死区后误差要超过 1.5×死区才重启，
                              #   防止噪声让指令在死区边界反复穿入穿出
  orientation_deadband_deg: 2.0   # 姿态误差死区（度）

  # ---- 目标速度前馈（高速跟随不拖后的关键）----
  vel_feedforward: 0.7    # 前馈系数，0=关闭，推荐 0.5~0.8；超前摆动则调低
  ff_smooth: 0.3          # 目标速度估计平滑系数（防检测跳变放大）
  ff_max_vel: 0.6         # 前馈速度限幅 (m/s)，防丢帧跳变
  ff_min_speed: 0.05      # 目标速度低于此值视为静止，前馈置零
                          # （手不动时深度噪声会被 ÷控制周期 放大成假速度）
  ff_taper_dist: 0.07     # 前馈近端渐弱距离 (m)：误差小于此值前馈线性退出，
                          #   到位后回环振荡就调大（0.10），巡航跟不上就调小

  # ---- 滤波与平滑 ----
  smooth_alpha: 0.38      # 速度指令 EMA 平滑：小=平滑但滞后大，大=响应脆
  reversal_fast_response: true    # 方向反转时清除平滑惯性（消"先反向冲一下"）
  depth_oe_min_cutoff: 1.0    # 深度通道 One Euro：静止时压 z3d 抖动，
                              #   静止仍微抖 → 0.7 → 0.5（纵向跟随会变肉）
  depth_oe_beta: 0.02         # 手快速靠近/远离时自动放开滤波的程度

  # ---- 姿态保持 ----
  k_orientation: 1.6      # 姿态修正增益（跟随中保持初始姿态）

  # ---- 相机 ----
  fps: 60                 # 相机帧率；Gemini2 支持 640x480@60，
                          #   高速跟随建议改 60（感知延迟砍半，CPU 要够）

# ---- 工作空间虚拟墙（基座系，米）----
# ⚠️ 安全相关：按你的实际桌面环境测量后修改！
# 软墙只削"继续往外走"的速度分量，允许贴墙滑动和向内返回
workspace:
  min: [-0.40, -0.10, 0.03]     # X 前后 / Y 左右 / Z 高度 下限
  max: [ 0.40,  0.40, 0.60]     # X 前后 / Y 左右 / Z 高度 上限
