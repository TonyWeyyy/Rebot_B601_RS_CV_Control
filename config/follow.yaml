# ============================================================
# 手掌跟随 伺服参数配置（含每个参数的调节范围标注）
# ------------------------------------------------------------
# palm_follow_grasp.py / palm_follow_fixed_orientation.py 启动时读取。
# 优先级：命令行参数 > 本文件 > 代码内置默认值。
#   例：python palm_follow_grasp.py            → 全部用本文件
#       python palm_follow_grasp.py --distance 0.35
#                                              → 仅距离被命令行覆盖
# 只改数字即可，改完直接重启脚本生效，不用动代码。
#
# 【提速版 vs 稳定版对照】（当前 = 提速版，晃了就逐项回退）
#   vel_feedforward:      提速 1.0  / 稳定 0.9
#   smooth_alpha:         提速 0.52 / 稳定 0.45
#   max_accel:            提速 2.8  / 稳定 2.0
#   reversal_accel_boost: 提速 2.0  / 稳定 1.8
#   depth_oe_min_cutoff:  提速 0.75 / 稳定 0.52
#   ff_smooth:            提速 0.55 / 稳定 0.48
#
# 范围标注说明：
#   【范围】= 物理/稳定性允许的硬边界，超出去大概率出问题
#   【推荐】= 实测好用的区间，日常在这个范围内调
# ============================================================

follow:
  # ---- 跟随目标 ----
  distance: 0.4           # 期望相机到掌心距离 (m)
                          # 【范围】0.20 ~ 0.60（代码硬性拒绝 <0.18 或 >0.60）
                          # 【推荐】0.25 ~ 0.45
                          # 太小：撞 Gemini 2 近距盲区（~0.15m），深度丢失
                          # 太大：检测不稳、工作空间容易触虚拟墙

  # ---- 增益（分方向）----
  gain: 2.5               # 竖直/深度方向位置增益（Y/Z）（仿真寻优结果）
                          # 【范围】1.0 ~ 3.5
                          # 【推荐】2.0 ~ 3.0
                          # 太小：跟随拖沓；太大：上下/前后方向出现振荡
  gain_x: 2.4             # 水平方向增益（X，左右跟随，靠底座 J1 偏航）
                          # 【范围】0.8 ~ 2.5
                          # 【推荐】1.4 ~ 2.2
                          # J1 惯量大限速低，偏高会饱和振荡（左右晃就先降它）

  # ---- 速度上限 ----
  max_vel: 0.60           # 最大末端线速度 (m/s)
                          # 【范围】0.10 ~ 0.70（关节上限提到 2.0 rad/s 后提速空间打开）
                          # 【推荐】0.30 ~ 0.50
                          # 注意与适配层 MAX_JOINT_SPEED 串联：
                          # 关节限速不提，光提这个没效果
  max_vel_joint: 1.60     # 最大关节速度 (rad/s)
                          # 【范围】0.6 ~ 2.0
                          # 【推荐】1.2 ~ 1.8
                          # 电机额定 ≈10.5 rad/s，硬件余量大；
                          # >1.5 后振荡倾向明显增大（瓶颈转到视觉延迟）；
                          # 出现抖动就退回 1.5
  max_vel_angular: 1.60   # 最大角速度 (rad/s)
                          # 【范围】0.5 ~ 2.0
                          # 【推荐】1.2 ~ 1.6（姿态保持任务，一般不用动）

  # ---- 死区（静止稳定性）----
  position_deadband: 0.017    # 3D 误差死区 (m)（BS 模式 z 噪声 ±20mm，0.015 会边界抖动）
                              # 【范围】0.008 ~ 0.030
                              # 【推荐】0.012 ~ 0.020
                              # 静止仍微抖 → 调大；想贴更近 → 调小
                              # <0.010 会围绕目标持续微抖
  deadband_hysteresis: 1.6    # 死区迟滞倍数（退出阈值 = 死区 × 此值）
                              # 【范围】1.2 ~ 2.5
                              # 【推荐】1.5 ~ 2.0
                              # 太大：手小幅移动机械臂不理（>死区×此值才动）
  orientation_deadband_deg: 2.0   # 姿态误差死区（度）
                                  # 【范围】1.0 ~ 5.0
                                  # 【推荐】2.0 ~ 3.0，一般不用动

  # ---- 目标速度前馈（高速跟随不拖后的关键）----
  vel_feedforward: 1.0    # 前馈系数（仿真寻优 0.88，取整 0.9）
                          # 【范围】0.0 ~ 1.0（0 = 完全关闭前馈）
                          # 【推荐】0.7 ~ 1.0
                          # 太大：机械臂超前于手、冲过头摆动
  ff_smooth: 0.55         # 目标速度估计平滑系数（新值权重）
                          # 【范围】0.1 ~ 0.6
                          # 【推荐】0.2 ~ 0.4，一般不用动
  ff_max_vel: 0.7         # 前馈速度限幅 (m/s)，防检测丢帧跳变
                          # 【范围】0.3 ~ 1.0
                          # 【推荐】0.5 ~ 0.8，应 ≥ 手正常挥动速度
  ff_min_speed: 0.030     # 目标速度低于此值视为静止，前馈置零
                          # 【范围】0.03 ~ 0.10
                          # 【推荐】0.04 ~ 0.08
                          # 太小：静止时噪声被注入；太大：慢速引导时前馈不生效
  ff_taper_dist: 0.07    # 前馈近端渐弱距离 (m)（仿真寻优结果）
                          # 【范围】0.04 ~ 0.12
                          # 【推荐】0.05 ~ 0.10
                          # 到位后回环振荡 → 调大；巡航跟不上 → 调小

  # ---- 滤波与平滑 ----
  smooth_alpha: 0.52      # 速度指令 EMA 平滑系数（新指令权重）（仿真寻优结果）
                          # 【范围】0.2 ~ 0.6
                          # 【推荐】0.3 ~ 0.55
                          # 小=平滑但滞后大；大=响应脆、过冲小但噪声多
  reversal_fast_response: true    # 方向反转时清除平滑惯性

  # ---- 加速度限制（启停平顺性）----
  max_accel: 2.8          # 末端线速度指令的最大加速度 (m/s^2)
                          # 【范围】0.5 ~ 5.0
                          # 【推荐】1.5 ~ 3.0
                          # 启停/刹不住地抖 → 调小（更柔和）；
                          # 觉得起步肉、跟不上 → 调大（2.5~3.0 仍有明显效果）
  reversal_accel_boost: 2.0   # 方向反转时的加速度额度倍数
                              # 【范围】1.0 ~ 3.0
                              # 反向纠错偏慢 → 调大；反向那一下有顿挫 → 调小
                                  # 【取值】true / false
                                  # 除非做对照实验，否则保持 true
  depth_oe_min_cutoff: 0.75   # 深度通道 One Euro 静止截止频率 (Hz)（压静止 z 噪声）
                              # 【范围】0.5 ~ 2.0
                              # 【推荐】0.7 ~ 1.2
                              # 静止微抖 → 调小；前后跟随肉 → 调大
  depth_oe_beta: 0.03         # 深度 One Euro 运动放开系数
                              # （手快速靠近/远离时自动放开滤波）
  z3d_max_jump: 0.08      # 深度跳变剔除阈值 (m)
                          # 【范围】0.04 ~ 0.15
                          # 【推荐】0.06 ~ 0.10
                          # 单帧 |Δz| 超阈值视为误检帧丢弃（等效本帧手掌丢失）
                          # 太小：快速贴近/远离相机时误杀正常帧
                          # 太大：误检尖峰漏网，手臂猛冲
                              # 【范围】0.005 ~ 0.05
                              # 【推荐】0.01 ~ 0.03，一般不用动

  # ---- 伸展度增益调度（前伸停靠振荡的解药）----
  # 手臂前伸越多，J1 杠杆臂越长、整臂刚度越低，同一组增益在
  # 伸展位姿会超出稳定裕度。TCP 水平半径 ≤ reach_soft_start 时
  # 参数原样；到 reach_soft_end 线性衰减到 reach_min_scale。
  reach_soft_start: 0.27  # 开始衰减的水平伸展半径 (m)（仿真寻优：晚介入+低增益优于早介入）
                          # 【范围】0.15 ~ 0.35
                          # 【推荐】0.20 ~ 0.28；太小：正常工作区也变肉
  reach_soft_end: 0.40    # 衰减到底的半径 (m)
                          # 【范围】0.30 ~ 0.50，应 ≈ workspace 的 X 上限
  reach_min_scale: 0.58   # 最深伸展时停靠段线速度指令的保留比例
                          # 【范围】0.40 ~ 1.00
                          # 【推荐】0.50 ~ 0.70
                          # 前伸停靠还抖 → 调小；前伸停靠太肉 → 调大；1.0 = 关闭本机制
  reach_dock_dist: 0.21   # 停靠段半径 (m)：误差小于此值才开始按伸展度衰减
                          # 【范围】0.10 ~ 0.30
                          # 【推荐】0.15 ~ 0.25
                          # 巡航段（误差大）永远全速，伸展区追手不受影响；
                          # 调太小：衰减介入太晚，停靠振荡压不住

  # ---- 姿态保持 ----
  k_orientation: 1.6      # 姿态修正增益（跟随中保持初始姿态）
                          # 【范围】0.8 ~ 2.5
                          # 【推荐】1.2 ~ 2.0
                          # 太大：末端出现扭振；太小：姿态漂移纠正慢

  # ---- 相机 ----
  fps: 60                 # 相机帧率
                          # 【取值】30 / 60（Gemini 2 在 640x480 下只有这两档实用）
                          # 60 = 感知延迟砍半，高速跟随首选；
                          # 若 DBG 行 fps 实测只有 40 左右，说明 CPU 跑不动，退回 30

# ---- 工作空间虚拟墙（基座系，米）----
# ⚠️ 安全相关：按你的实际桌面环境测量后修改！
# 【范围】X: 0.05~0.45（前后），Y: -0.40~0.40（左右），Z: 0.03~0.60（高度）
# 软墙只削"继续往外走"的速度分量，允许贴墙滑动和向内返回；
# 收缩边界 = 更保守，放宽边界 = 更大工作范围但需确认无碰撞物
workspace:
  min: [-0.40, -0.10, 0.03]     # X 前后 / Y 左右 / Z 高度 下限
  max: [ 0.40,  0.40, 0.60]     # X 前后 / Y 左右 / Z 高度 上限
