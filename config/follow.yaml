# ============================================================
# 手掌跟随 伺服参数配置（含每个参数的调节范围标注）
# ------------------------------------------------------------
# palm_follow_grasp.py / palm_follow_fixed_orientation.py 启动时读取。
# 优先级：命令行参数 > 本文件 > 代码内置默认值。
#   例：python palm_follow_grasp.py            → 全部用本文件
#       python palm_follow_grasp.py --distance 0.35
#                                              → 仅距离被命令行覆盖
# 只改数字即可，改完直接重启脚本生效，不用动代码。
#
# 范围标注说明：
#   【范围】= 物理/稳定性允许的硬边界，超出去大概率出问题
#   【推荐】= 实测好用的区间，日常在这个范围内调
# ============================================================

follow:
  # ---- 跟随目标 ----
  distance: 0.4           # 期望相机到掌心距离 (m)
                          # 【范围】0.20 ~ 0.60（代码硬性拒绝 <0.18 或 >0.60）
                          # 【推荐】0.25 ~ 0.45
                          # 太小：撞 Gemini 2 近距盲区（~0.15m），深度丢失
                          # 太大：检测不稳、工作空间容易触虚拟墙

  # ---- 增益（分方向）----
  gain: 2.5               # 竖直/深度方向位置增益（Y/Z）
                          # 【范围】1.0 ~ 3.5
                          # 【推荐】2.0 ~ 3.0
                          # 太小：跟随拖沓；太大：上下/前后方向出现振荡
  gain_x: 2.2             # 水平方向增益（X，左右跟随，靠底座 J1 偏航）
                          # 【范围】0.8 ~ 2.5
                          # 【推荐】1.4 ~ 2.2
                          # J1 惯量大限速低，偏高会饱和振荡（左右晃就先降它）

  # ---- 速度上限 ----
  max_vel: 0.45            # 最大末端线速度 (m/s)
                          # 【范围】0.10 ~ 0.50
                          # 【推荐】0.30 ~ 0.45
                          # 注意与适配层 MAX_JOINT_SPEED 串联：
                          # 关节限速不提，光提这个没效果
  max_vel_joint: 1.50     # 最大关节速度 (rad/s)
                          # 【范围】0.6 ~ 2.0
                          # 【推荐】1.0 ~ 1.5
                          # 电机额定 ≈10.5 rad/s，硬件余量大；
                          # >1.5 后振荡倾向明显增大（瓶颈转到视觉延迟）
  max_vel_angular: 1.60   # 最大角速度 (rad/s)
                          # 【范围】0.5 ~ 2.0
                          # 【推荐】1.2 ~ 1.6（姿态保持任务，一般不用动）

  # ---- 死区（静止稳定性）----
  position_deadband: 0.015    # 3D 误差死区 (m)
                              # 【范围】0.008 ~ 0.030
                              # 【推荐】0.012 ~ 0.020
                              # 静止仍微抖 → 调大；想贴更近 → 调小
                              # <0.010 会围绕目标持续微抖
  deadband_hysteresis: 2.0    # 死区迟滞倍数（退出阈值 = 死区 × 此值）
                              # 【范围】1.2 ~ 2.5
                              # 【推荐】1.5 ~ 2.0
                              # 太大：手小幅移动机械臂不理（>死区×此值才动）
  orientation_deadband_deg: 2.0   # 姿态误差死区（度）
                                  # 【范围】1.0 ~ 5.0
                                  # 【推荐】2.0 ~ 3.0，一般不用动

  # ---- 目标速度前馈（高速跟随不拖后的关键）----
  vel_feedforward: 0.9    # 前馈系数
                          # 【范围】0.0 ~ 1.0（0 = 完全关闭前馈）
                          # 【推荐】0.5 ~ 0.8
                          # 太大：机械臂超前于手、冲过头摆动
  ff_smooth: 0.4          # 目标速度估计平滑系数（新值权重）
                          # 【范围】0.1 ~ 0.6
                          # 【推荐】0.2 ~ 0.4，一般不用动
  ff_max_vel: 0.7         # 前馈速度限幅 (m/s)，防检测丢帧跳变
                          # 【范围】0.3 ~ 1.0
                          # 【推荐】0.5 ~ 0.8，应 ≥ 手正常挥动速度
  ff_min_speed: 0.035      # 目标速度低于此值视为静止，前馈置零
                          # 【范围】0.03 ~ 0.10
                          # 【推荐】0.04 ~ 0.08
                          # 太小：静止时噪声被注入；太大：慢速引导时前馈不生效
  ff_taper_dist: 0.10     # 前馈近端渐弱距离 (m)
                          # 【范围】0.04 ~ 0.12
                          # 【推荐】0.05 ~ 0.10
                          # 到位后回环振荡 → 调大；巡航跟不上 → 调小

  # ---- 滤波与平滑 ----
  smooth_alpha: 0.55      # 速度指令 EMA 平滑系数（新指令权重）
                          # 【范围】0.2 ~ 0.6
                          # 【推荐】0.3 ~ 0.55
                          # 小=平滑但滞后大；大=响应脆、过冲小但噪声多
  reversal_fast_response: true    # 方向反转时清除平滑惯性
                                  # 【取值】true / false
                                  # 除非做对照实验，否则保持 true
  depth_oe_min_cutoff: 0.7    # 深度通道 One Euro 静止截止频率 (Hz)
                              # 【范围】0.5 ~ 2.0
                              # 【推荐】0.7 ~ 1.2
                              # 静止微抖 → 调小；前后跟随肉 → 调大
  depth_oe_beta: 0.03         # 深度 One Euro 运动放开系数
                              # 【范围】0.005 ~ 0.05
                              # 【推荐】0.01 ~ 0.03，一般不用动

  # ---- 姿态保持 ----
  k_orientation: 1.5      # 姿态修正增益（跟随中保持初始姿态）
                          # 【范围】0.8 ~ 2.5
                          # 【推荐】1.2 ~ 2.0
                          # 太大：末端出现扭振；太小：姿态漂移纠正慢

  # ---- 相机 ----
  fps: 60                 # 相机帧率
                          # 【取值】30 / 60（Gemini 2 在 640x480 下只有这两档实用）
                          # 60 = 感知延迟砍半，高速跟随首选；
                          # 若 DBG 行 fps 实测只有 40 左右，说明 CPU 跑不动，退回 30

# ---- 工作空间虚拟墙（基座系，米）----
# ⚠️ 安全相关：按你的实际桌面环境测量后修改！
# 【范围】X: 0.05~0.45（前后），Y: -0.40~0.40（左右），Z: 0.03~0.60（高度）
# 软墙只削"继续往外走"的速度分量，允许贴墙滑动和向内返回；
# 收缩边界 = 更保守，放宽边界 = 更大工作范围但需确认无碰撞物
workspace:
  min: [-0.40, -0.10, 0.03]     # X 前后 / Y 左右 / Z 高度 下限
  max: [ 0.40,  0.40, 0.60]     # X 前后 / Y 左右 / Z 高度 上限